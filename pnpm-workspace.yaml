# dprint's install script fetches its native binary — the formatter cannot run without
# it, so this one has to be allowed.
#
# msgpackr-extract is an optional native accelerator for msgpack serialisation.
# Declining it costs a little speed on a path we do not use, and avoids running an
# install script we have not vetted.
allowBuilds:
  dprint: true
  msgpackr-extract: false
